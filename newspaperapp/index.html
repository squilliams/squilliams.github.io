<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Publication Downloader</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <style>
    :root {
      --bg: #d7ece7;
      --surface: #ffffff;
      --surface-soft: #f4f8f7;
      --text: #12332d;
      --muted: #4a6a63;
      --accent: #0a7f70;
      --accent-strong: #055b50;
      --danger: #b3261e;
      --shadow: 0 14px 34px rgba(16, 50, 44, 0.16);
      --radius: 14px;
      --radius-sm: 10px;
      --border: 1px solid rgba(9, 67, 58, 0.16);
    }

    body.dark-mode {
      --bg: #0f1917;
      --surface: #1a2623;
      --surface-soft: #1f302c;
      --text: #f0fbf8;
      --muted: #b8d1ca;
      --accent: #22b7a5;
      --accent-strong: #2cd5c0;
      --danger: #ff8177;
      --shadow: 0 16px 36px rgba(0, 0, 0, 0.38);
      --border: 1px solid rgba(111, 181, 170, 0.24);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Source Sans 3', sans-serif;
      background: radial-gradient(circle at 20% 20%, #e9f7f4 0, transparent 45%), var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 16px 22px;
      transition: background 0.25s ease, color 0.25s ease;
    }

    body.dark-mode {
      background: radial-gradient(circle at 20% 20%, #163530 0, transparent 48%), var(--bg);
    }

    .container {
      width: min(700px, 100%);
      background: var(--surface);
      border-radius: calc(var(--radius) + 8px);
      box-shadow: var(--shadow);
      border: var(--border);
      padding: 28px 24px;
      position: relative;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      text-align: center;
      margin: 4px 0 22px;
      color: var(--accent);
      letter-spacing: 0.2px;
      font-size: clamp(1.8rem, 2.8vw, 2.35rem);
    }

    .utility-buttons {
      position: absolute;
      top: 14px;
      right: 14px;
      display: flex;
      gap: 8px;
    }

    .utility-btn {
      border: var(--border);
      background: var(--surface-soft);
      color: var(--accent);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.2s ease, background-color 0.2s ease;
    }

    .utility-btn:hover {
      transform: translateY(-1px);
      background: rgba(10, 127, 112, 0.12);
    }

    .utility-btn i {
      font-size: 1.1rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-bottom: 16px;
    }

    .type-fieldset {
      margin: 0;
      padding: 0;
      border: 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .type-fieldset legend {
      color: var(--text);
      font-weight: 600;
      font-size: 0.98rem;
      padding: 0;
    }

    label {
      color: var(--text);
      font-weight: 600;
      font-size: 0.98rem;
    }

    .radio-container {
      display: inline-flex;
      background: var(--surface-soft);
      border-radius: 12px;
      border: var(--border);
      padding: 4px;
      width: fit-content;
      gap: 4px;
    }

    .radio-container input[type="radio"] {
      position: absolute;
      opacity: 0.0001;
      width: 1px;
      height: 1px;
      pointer-events: none;
    }

    .radio-container label {
      margin: 0;
      padding: 8px 16px;
      border-radius: 9px;
      cursor: pointer;
      color: var(--muted);
      font-weight: 600;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .radio-container input[type="radio"]:checked + label {
      background: var(--surface);
      color: var(--accent);
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
    }

    .radio-container input[type="radio"]:focus-visible + label {
      outline: 3px solid rgba(10, 127, 112, 0.4);
      outline-offset: 2px;
    }

    select,
    input[type="date"],
    input[type="text"],
    input[type="number"] {
      width: 100%;
      padding: 11px 12px;
      border-radius: 10px;
      border: var(--border);
      background: var(--surface-soft);
      color: var(--text);
      font-size: 1rem;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    select:focus,
    input:focus {
      outline: none;
      border-color: rgba(10, 127, 112, 0.7);
      box-shadow: 0 0 0 3px rgba(10, 127, 112, 0.14);
    }

    .publication-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .publication-row select {
      flex: 1;
    }

    .favorite-toggle {
      width: 44px;
      min-width: 44px;
      height: 44px;
      border-radius: 10px;
      border: var(--border);
      background: var(--surface-soft);
      color: #f5a524;
      font-size: 1.2rem;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .favorite-toggle:hover {
      transform: translateY(-1px);
    }

    .schedule-info {
      margin-top: 8px;
      padding: 10px 12px;
      border-radius: 10px;
      background: var(--surface-soft);
      border: var(--border);
      color: var(--muted);
      line-height: 1.35;
      font-size: 0.95rem;
    }

    .field-help {
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.3;
    }

    .download-btn,
    .reader-btn,
    .page-btn,
    .mode-btn,
    .zoom-btn {
      border: none;
      cursor: pointer;
      border-radius: 10px;
      font-weight: 600;
      transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
    }

    .download-btn,
    .reader-btn {
      width: 100%;
      margin-top: 8px;
      padding: 13px 16px;
      background: linear-gradient(145deg, var(--accent), var(--accent-strong));
      color: #fff;
      font-size: 1.02rem;
      box-shadow: 0 10px 18px rgba(7, 92, 79, 0.28);
    }

    .download-btn:hover,
    .reader-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 24px rgba(7, 92, 79, 0.34);
    }

    .download-btn:disabled,
    .reader-btn:disabled,
    .page-btn:disabled,
    .mode-btn:disabled,
    .zoom-btn:disabled {
      opacity: 0.58;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .status {
      margin-top: 12px;
      min-height: 1.2em;
      text-align: center;
      color: var(--muted);
      font-weight: 500;
    }

    .reader-shell {
      width: min(1200px, 100%);
      margin-top: 18px;
      background: var(--surface);
      border-radius: calc(var(--radius) + 8px);
      border: var(--border);
      box-shadow: var(--shadow);
      padding: 18px;
    }

    .reader-header {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 12px;
      align-items: center;
    }

    .reader-title h2 {
      margin: 0;
      font-size: 1.2rem;
      color: var(--text);
    }

    .reader-title p {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 0.94rem;
    }

    .reader-header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .reader-header .reader-btn {
      margin: 0;
      width: auto;
      padding: 10px 14px;
      font-size: 0.95rem;
      box-shadow: 0 8px 15px rgba(7, 92, 79, 0.22);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .reader-toolbar {
      margin-top: 12px;
      padding: 10px;
      border-radius: 12px;
      border: var(--border);
      background: var(--surface-soft);
      display: flex;
      gap: 12px;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      position: sticky;
      top: 10px;
      z-index: 4;
    }

    .mode-group,
    .gallery-controls,
    .focus-controls,
    .focus-page-controls {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .mode-btn,
    .page-btn,
    .zoom-btn {
      background: var(--surface);
      border: var(--border);
      color: var(--text);
      padding: 8px 12px;
    }

    .mode-btn.active,
    .fit-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .api-hint {
      margin-top: 10px;
      padding: 9px 12px;
      border-radius: 10px;
      border: var(--border);
      background: var(--surface-soft);
      color: var(--muted);
      font-size: 0.9rem;
    }

    .api-hint.warning {
      border-color: rgba(179, 38, 30, 0.38);
      color: var(--danger);
      background: rgba(179, 38, 30, 0.08);
    }

    .gallery-grid {
      margin-top: 14px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 14px;
    }

    .thumb-card {
      border: var(--border);
      border-radius: 12px;
      padding: 9px;
      background: var(--surface-soft);
      box-shadow: 0 8px 15px rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .thumb-btn {
      border: none;
      padding: 0;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      background: #d2e3de;
      display: block;
    }

    .thumb-btn img {
      width: 100%;
      display: block;
      aspect-ratio: 3 / 4;
      object-fit: cover;
    }

    .thumb-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--text);
    }

    .gallery-pagination {
      margin-top: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--muted);
      font-weight: 600;
    }

    .focus-view {
      margin-top: 12px;
    }

    .focus-stage {
      border: var(--border);
      background: #0e1614;
      border-radius: 12px;
      padding: 12px;
      min-height: 280px;
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .focus-stage img {
      transform-origin: top center;
      transition: transform 0.15s ease;
      border-radius: 4px;
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.35);
    }

    .focus-stage img.fit-width {
      width: 100%;
      max-width: 900px;
      height: auto;
    }

    .focus-stage img.fit-height {
      width: auto;
      height: min(76vh, 860px);
      max-width: none;
    }

    .focus-stage img.fit-none {
      width: auto;
      height: auto;
      max-width: none;
    }

    .focus-footer {
      margin-top: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      color: var(--muted);
      font-weight: 600;
    }

    .focus-footer input[type="number"] {
      width: 90px;
      padding: 7px 9px;
    }

    .empty-state {
      margin-top: 14px;
      border: var(--border);
      border-radius: 12px;
      background: var(--surface-soft);
      padding: 34px 18px;
      text-align: center;
      color: var(--muted);
    }

    .toast {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 1200;
      color: #fff;
      border-radius: 10px;
      padding: 12px 15px;
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.3);
      transform: translateY(26px);
      opacity: 0;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .toast.success {
      background: #077f69;
    }

    .toast.error {
      background: #b3261e;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    .favorites-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 1300;
    }

    .favorites-content {
      width: min(440px, 100%);
      background: var(--surface);
      border: var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 16px;
    }

    .favorites-content h3 {
      margin: 0 0 12px;
    }

    .favorite-item {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
      padding: 9px 10px;
      border-radius: 10px;
      background: var(--surface-soft);
      border: var(--border);
      margin-bottom: 8px;
    }

    .favorite-remove {
      border: none;
      border-radius: 8px;
      padding: 6px 8px;
      background: rgba(179, 38, 30, 0.15);
      color: var(--danger);
      cursor: pointer;
      font-weight: 700;
    }

    .utility-btn:focus-visible,
    .favorite-toggle:focus-visible,
    .download-btn:focus-visible,
    .reader-btn:focus-visible,
    .page-btn:focus-visible,
    .mode-btn:focus-visible,
    .zoom-btn:focus-visible,
    .thumb-btn:focus-visible,
    .favorite-remove:focus-visible,
    select:focus-visible,
    input:focus-visible {
      outline: 3px solid rgba(10, 127, 112, 0.45);
      outline-offset: 2px;
    }

    .footer {
      margin-top: 16px;
      font-size: 0.95rem;
      color: var(--muted);
      text-align: center;
    }

    .footer a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 920px) {
      .reader-header {
        grid-template-columns: 1fr;
        align-items: stretch;
      }

      .reader-header-actions {
        justify-content: space-between;
      }
    }

    @media (max-width: 640px) {
      body {
        padding: 18px 10px 16px;
      }

      .container {
        padding: 22px 14px;
      }

      .reader-shell {
        padding: 12px;
      }

      .gallery-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .focus-stage img.fit-height {
        height: min(62vh, 700px);
      }

      .reader-toolbar {
        position: static;
      }

      .utility-buttons {
        top: 10px;
        right: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="container" id="homeContainer">
    <div class="utility-buttons">
      <button id="darkModeToggle" class="utility-btn" title="Toggle dark mode" aria-label="Toggle dark mode">
        <i class="ph ph-moon"></i>
      </button>
      <button id="favoritesToggle" class="utility-btn" title="Favorites" aria-label="Open favorites">
        <i class="ph ph-star"></i>
      </button>
    </div>

    <h1>Publication Downloader</h1>

    <div class="form-group">
      <fieldset class="type-fieldset">
      <legend>Select Type</legend>
      <div class="radio-container" role="radiogroup" aria-label="Publication type">
        <input type="radio" id="newspaperType" name="type" value="newspaper" checked>
        <label for="newspaperType">Newspaper</label>
        <input type="radio" id="magazineType" name="type" value="magazine">
        <label for="magazineType">Magazine</label>
      </div>
      </fieldset>
    </div>

    <div class="form-group">
      <label for="publicationSelect">Publication</label>
      <div class="publication-row">
        <select id="publicationSelect"></select>
        <button id="favoriteCurrentBtn" class="favorite-toggle" title="Favorite this publication" aria-label="Favorite this publication">☆</button>
      </div>
      <div id="scheduleInfo" class="schedule-info"></div>
    </div>

    <div class="form-group">
      <label for="dateInput">Date</label>
      <input type="date" id="dateInput" />
    </div>

    <div class="form-group" id="timeGroup">
      <label for="timeInput">Edition Code</label>
      <input type="text" id="timeInput" aria-describedby="timeHelp" placeholder="Auto-filled per publication" />
      <small class="field-help" id="timeHelp">Auto-generated from the selected newspaper. This field is read-only.</small>
    </div>

    <button class="download-btn" id="downloadBtn">Download</button>
    <div class="status" id="status" role="status" aria-live="polite" aria-atomic="true"></div>
  </div>

  <section id="magazineReader" class="reader-shell" hidden>
    <div class="reader-header">
      <button id="backToHomeBtn" class="mode-btn" type="button">
        <i class="ph ph-arrow-left"></i>
        Back
      </button>

      <div class="reader-title">
        <h2 id="readerTitle">Magazine Reader</h2>
        <p id="readerSubtitle"></p>
      </div>

      <div class="reader-header-actions">
        <button id="downloadPdfBtn" class="reader-btn" type="button">
          <i class="ph ph-file-pdf"></i>
          Download as PDF
        </button>
      </div>
    </div>

    <div class="reader-toolbar">
      <div class="mode-group">
        <button id="galleryModeBtn" class="mode-btn active" type="button">Gallery</button>
        <button id="focusModeBtn" class="mode-btn" type="button">Reader</button>
      </div>

      <div id="galleryControls" class="gallery-controls">
        <button id="galleryPrevBtn" class="page-btn" type="button">Prev</button>
        <span id="galleryPageInfo">Page 1 of 1</span>
        <button id="galleryNextBtn" class="page-btn" type="button">Next</button>
      </div>

      <div id="focusControls" class="focus-controls" hidden>
        <button id="zoomOutBtn" class="zoom-btn" type="button">-</button>
        <span id="zoomPercent">100%</span>
        <button id="zoomInBtn" class="zoom-btn" type="button">+</button>
        <button id="zoomResetBtn" class="zoom-btn" type="button">100%</button>
        <button id="fitWidthBtn" class="zoom-btn fit-btn active" type="button">Fit width</button>
        <button id="fitHeightBtn" class="zoom-btn fit-btn" type="button">Fit height</button>
        <button id="fitNoneBtn" class="zoom-btn fit-btn" type="button">Actual size</button>
      </div>
    </div>

    <div id="pdfApiHint" class="api-hint"></div>
    <div id="readerStatus" class="status" role="status" aria-live="polite" aria-atomic="true"></div>

    <div id="galleryView">
      <div id="galleryGrid" class="gallery-grid"></div>
      <div class="gallery-pagination">
        <span id="galleryRangeInfo"></span>
      </div>
    </div>

    <div id="focusView" class="focus-view" hidden>
      <div class="focus-stage" id="focusStage">
        <img id="focusImage" class="fit-width" alt="Magazine page preview" />
      </div>
      <div class="focus-footer">
        <div class="focus-page-controls">
          <button id="focusPrevBtn" class="page-btn" type="button">Previous page</button>
          <span id="focusPageInfo">Page 1 / 1</span>
          <button id="focusNextBtn" class="page-btn" type="button">Next page</button>
        </div>

        <div class="focus-page-controls">
          <label for="pageJumpInput">Go to page</label>
          <input id="pageJumpInput" type="number" min="1" value="1">
          <button id="pageJumpBtn" class="page-btn" type="button">Go</button>
        </div>
      </div>
    </div>
  </section>

  <div class="footer">
    Made with ❤️ by <a href="https://tyasono.xyz" target="_blank" rel="noopener noreferrer">Bimo</a>
  </div>

  <script>
    const IMAGE_PROXY_STORAGE_KEY = 'magazineImageProxyUrl';
    const DEFAULT_IMAGE_PROXY_URL = '';
    const DEFAULT_ITEMS_PER_GALLERY_PAGE = 8;

    const config = {
      newspaper: {
        kompas: { name: 'Kompas', urlPattern: 'https://eperpus.dotsolution.net/custom/ori/{YYYY}-{MM}-{DD}-{time}-0001.pdf', defaultTime: '1013' },
        pikiran_rakyat: { name: 'Pikiran Rakyat', urlPattern: 'https://eperpus.dotsolution.net/custom/ori/{YYYY}-{MM}-{DD}-{time}-0001.pdf', defaultTime: '1020' },
        jawa_pos: { name: 'Jawa Pos', urlPattern: 'https://eperpus.dotsolution.net/custom/ori/{YYYY}-{MM}-{DD}-{time}-0001.pdf', defaultTime: '1031' },
        bisnis_indonesia: { name: 'Bisnis Indonesia', urlPattern: 'https://eperpus.dotsolution.net/custom/ori/{YYYY}-{MM}-{DD}-{time}-0001.pdf', defaultTime: '1002' },
        neraca: { name: 'Neraca', urlPattern: 'https://eperpus.dotsolution.net/custom/ori/{YYYY}-{MM}-{DD}-{time}-0001.pdf', defaultTime: '1004' },
        media_indonesia: { name: 'Media Indonesia', urlPattern: 'https://eperpus.dotsolution.net/custom/ori/{YYYY}-{MM}-{DD}-{time}-0001.pdf', defaultTime: '1017' },
        the_jakarta_post: { name: 'The Jakarta Post', urlPattern: 'https://eperpus.dotsolution.net/custom/ori/{YYYY}-{MM}-{DD}-{time}-0001.pdf', defaultTime: '1029' },
        kontan: { name: 'Kontan', urlPattern: 'https://eperpus.dotsolution.net/custom/ori/{YYYY}-{MM}-{DD}-{time}-0001.pdf', defaultTime: '1005' },
        financial_times: { name: 'Financial Times', urlPattern: 'https://eperpus.dotsolution.net/custom/ori/{YYYY}-{MM}-{DD}-{time}-0001.pdf', defaultTime: '1035' }
      },
      magazine: {
        the_economist: { name: 'The Economist', id: '4037', startPage: 1, maxPages: 150 },
        tempo: { name: 'TEMPO', id: '4036', startPage: 1, maxPages: 150 },
        time: { name: 'TIME', id: '4071', startPage: 1, maxPages: 150 },
        guardian: { name: 'Guardian', id: '4074', startPage: 1, maxPages: 150 },
        bloomberg: { name: 'Bloomberg', id: '4041', startPage: 1, maxPages: 150 }
      }
    };

    const schedules = {
      kompas: 'Published every day morning WIB',
      jawa_pos: 'Published every day morning WIB',
      bisnis_indonesia: 'Published every day morning WIB',

    function showToast(message, type = 'success') {
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.textContent = message;
      toast.setAttribute('role', type === 'error' ? 'alert' : 'status');
      toast.setAttribute('aria-live', type === 'error' ? 'assertive' : 'polite');
      toast.setAttribute('aria-atomic', 'true');
      document.body.appendChild(toast);
      requestAnimationFrame(() => toast.classList.add('show'));

      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 220);
      }, 2600);
    }

    function showLoading(button, text = 'Loading...') {
      button.disabled = true;
      button.dataset.originalText = button.innerHTML;
      button.innerHTML = `<i class="ph ph-spinner"></i> ${text}`;
    }

    function hideLoading(button) {
      button.disabled = false;
      if (button.dataset.originalText) {
        button.innerHTML = button.dataset.originalText;
      }
    }

    function pad(num) {
      return num.toString().padStart(2, '0');
    }

    function getSelectedType() {
      return document.querySelector('input[name="type"]:checked').value;

    function constructNewspaperURL(pubConfig, dateStr, time) {
      const dateObj = new Date(dateStr);
      const YYYY = dateObj.getFullYear();
      const MM = pad(dateObj.getMonth() + 1);
      const DD = pad(dateObj.getDate());
      return pubConfig.urlPattern
        .replace('{YYYY}', YYYY)
        .replace('{MM}', MM)
        .replace('{DD}', DD)
        .replace('{time}', time);
    }

    function downloadFile(url, filename) {
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);

    function sanitizeFileName(name) {

    function toggleFavorite(type, pubKey, pubName) {
      const existingIndex = favorites.findIndex((fav) => fav.type === type && fav.pubKey === pubKey);
      if (existingIndex >= 0) {
        favorites.splice(existingIndex, 1);
        showToast(`Removed ${pubName} from favorites`, 'success');
      } else {
        favorites.push({ type, pubKey, pubName });

      localStorage.setItem('favorites', JSON.stringify(favorites));
      updateFavoriteCurrentButton();

    function openFavoritesModal() {
      const previousFocus = document.activeElement;
      const modal = document.createElement('div');
      modal.className = 'favorites-modal';
      modal.setAttribute('role', 'presentation');

      const content = document.createElement('div');
      content.className = 'favorites-content';
      content.setAttribute('role', 'dialog');
      content.setAttribute('aria-modal', 'true');
      content.setAttribute('aria-labelledby', 'favoritesDialogTitle');
      content.tabIndex = -1;

      const title = document.createElement('h3');
      title.id = 'favoritesDialogTitle';
      title.textContent = 'Favorites';
      content.appendChild(title);

      const listContainer = document.createElement('div');
      content.appendChild(listContainer);

      function renderFavoritesList() {
        listContainer.innerHTML = '';

        if (!favorites.length) {
          const empty = document.createElement('p');
          empty.textContent = 'No favorites yet.';
          empty.style.color = 'var(--muted)';
          listContainer.appendChild(empty);
          return;
        }

        favorites.forEach((fav) => {
          const item = document.createElement('div');
          item.className = 'favorite-item';

          const left = document.createElement('div');
          left.innerHTML = `<strong>${fav.pubName}</strong><br><small>${fav.type}</small>`;

          const removeBtn = document.createElement('button');
          removeBtn.className = 'favorite-remove';
          removeBtn.textContent = 'Remove';
          removeBtn.type = 'button';
          removeBtn.addEventListener('click', () => {
            toggleFavorite(fav.type, fav.pubKey, fav.pubName);
            renderFavoritesList();
          });

          item.appendChild(left);
          item.appendChild(removeBtn);
          listContainer.appendChild(item);
        });
      }

      const closeBtn = document.createElement('button');
      closeBtn.className = 'mode-btn';
      closeBtn.textContent = 'Close';
      closeBtn.type = 'button';
      closeBtn.style.width = '100%';
      closeBtn.style.marginTop = '8px';
      closeBtn.addEventListener('click', closeModal);
      content.appendChild(closeBtn);

      function getFocusableElements() {
        return content.querySelectorAll(
          'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'
        );
      }

      function closeModal() {
        document.removeEventListener('keydown', onDialogKeyDown, true);
        modal.remove();
        if (previousFocus && typeof previousFocus.focus === 'function') {
          previousFocus.focus();
        }
      }

      function onDialogKeyDown(event) {
        if (event.key === 'Escape') {
          event.preventDefault();
          closeModal();
          return;
        }

        if (event.key !== 'Tab') {
          return;
        }

        const focusable = Array.from(getFocusableElements());
        if (!focusable.length) {
          event.preventDefault();
          return;
        }

        const first = focusable[0];
        const last = focusable[focusable.length - 1];
        const active = document.activeElement;

        if (event.shiftKey && active === first) {
          event.preventDefault();
          last.focus();
        } else if (!event.shiftKey && active === last) {
          event.preventDefault();
          first.focus();
        }
      }

      renderFavoritesList();
      modal.appendChild(content);
      modal.addEventListener('click', (event) => {
        if (event.target === modal) {
          closeModal();
        }
      });

      document.body.appendChild(modal);
      document.addEventListener('keydown', onDialogKeyDown, true);
      content.focus();
    }

    async function imageExists(url, timeoutMs = 4500) {
      return new Promise((resolve) => {
        const img = new Image();
        let settled = false;

        const finish = (value) => {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          img.onload = null;
          img.onerror = null;
          resolve(value);
        };

        const timer = setTimeout(() => finish(false), timeoutMs);
        img.onload = () => finish(true);
        img.onerror = () => finish(false);
        img.src = `${url}?v=${Date.now()}`;
      });
    }

    function formatMagazinePathDate(dateStr) {
      const dateObj = new Date(dateStr);
      return `${dateObj.getFullYear()}/${pad(dateObj.getMonth() + 1)}/${pad(dateObj.getDate())}`;
    }

    async function discoverMagazinePages(pubConfig, dateStr) {
      const pages = [];
      const formattedDate = formatMagazinePathDate(dateStr);
      const start = pubConfig.startPage || 1;
      const max = pubConfig.maxPages || 150;

      for (let pageNumber = start; pageNumber <= max; pageNumber++) {
        if ((pageNumber - start) % 10 === 0) {
          setStatus(`Scanning page ${pageNumber}...`, dom.readerStatus);
        }

        const thumbUrl = `https://epaper.dotsolution.net/assets/file_media/${pubConfig.id}/${formattedDate}/small/${pageNumber}.jpg`;
        const largeUrl = `https://epaper.dotsolution.net/assets/file_media/${pubConfig.id}/${formattedDate}/large/${pageNumber}.jpg`;
        const exists = await imageExists(thumbUrl);

        if (exists) {
          pages.push({ pageNumber, thumbUrl, largeUrl });
        } else {
          break;
        }
      }

      return pages;
    }

    function getTotalGalleryPages() {
      return Math.max(1, Math.ceil(state.magazinePages.length / DEFAULT_ITEMS_PER_GALLERY_PAGE));
    }

    function updateGalleryPaginationInfo() {
      const totalPages = getTotalGalleryPages();
      dom.galleryPageInfo.textContent = `Page ${state.galleryPage} of ${totalPages}`;
      dom.galleryPrevBtn.disabled = state.galleryPage <= 1;
      dom.galleryNextBtn.disabled = state.galleryPage >= totalPages;

      if (!state.magazinePages.length) {
        dom.galleryRangeInfo.textContent = 'No pages found';
        return;
      }

      const start = (state.galleryPage - 1) * DEFAULT_ITEMS_PER_GALLERY_PAGE + 1;
      const end = Math.min(start + DEFAULT_ITEMS_PER_GALLERY_PAGE - 1, state.magazinePages.length);
      dom.galleryRangeInfo.textContent = `Showing pages ${start}-${end} of ${state.magazinePages.length}`;
    }

    function renderGallery() {
      dom.galleryGrid.innerHTML = '';

      if (!state.magazinePages.length) {
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.innerHTML = '<h3>Edition not available</h3><p>This edition has no published pages yet. Try another date.</p>';
        dom.galleryGrid.appendChild(empty);
        updateGalleryPaginationInfo();
        return;
      }

      const start = (state.galleryPage - 1) * DEFAULT_ITEMS_PER_GALLERY_PAGE;
      const end = start + DEFAULT_ITEMS_PER_GALLERY_PAGE;
      const pageSlice = state.magazinePages.slice(start, end);

      pageSlice.forEach((page) => {
        const card = document.createElement('article');
        card.className = 'thumb-card';

        const thumbButton = document.createElement('button');
        thumbButton.className = 'thumb-btn';
        thumbButton.type = 'button';
        thumbButton.title = `Open page ${page.pageNumber} in reader mode`;

        const img = document.createElement('img');
        img.src = page.thumbUrl;
        img.alt = `Magazine page ${page.pageNumber}`;
        img.loading = 'lazy';

        thumbButton.appendChild(img);
        thumbButton.addEventListener('click', () => {
          state.readerPageIndex = state.magazinePages.findIndex((item) => item.pageNumber === page.pageNumber);
          setViewMode('reader');
        });

        const meta = document.createElement('div');
        meta.className = 'thumb-meta';
        meta.innerHTML = `<span>Page ${page.pageNumber}</span><span>Tap to read</span>`;

        card.appendChild(thumbButton);
        card.appendChild(meta);
        dom.galleryGrid.appendChild(card);
      });

      updateGalleryPaginationInfo();
    }

    function applyFitButtons() {
      const fitButtons = [dom.fitWidthBtn, dom.fitHeightBtn, dom.fitNoneBtn];
      fitButtons.forEach((button) => button.classList.remove('active'));
      if (state.fitMode === 'width') dom.fitWidthBtn.classList.add('active');
      if (state.fitMode === 'height') dom.fitHeightBtn.classList.add('active');
      if (state.fitMode === 'none') dom.fitNoneBtn.classList.add('active');
    }

    function renderReaderPage() {
      if (!state.magazinePages.length) {
        dom.focusImage.removeAttribute('src');
        dom.focusPageInfo.textContent = 'Page 0 / 0';
        return;
      }

      const page = state.magazinePages[state.readerPageIndex];
      dom.focusImage.src = page.largeUrl;
      dom.focusImage.alt = `Magazine page ${page.pageNumber}`;
      dom.focusPageInfo.textContent = `Page ${page.pageNumber} / ${state.magazinePages.length}`;
      dom.pageJumpInput.max = String(state.magazinePages.length);
      dom.pageJumpInput.value = String(page.pageNumber);

      dom.focusPrevBtn.disabled = state.readerPageIndex <= 0;
      dom.focusNextBtn.disabled = state.readerPageIndex >= state.magazinePages.length - 1;

      dom.focusImage.classList.remove('fit-width', 'fit-height', 'fit-none');
      dom.focusImage.classList.add(`fit-${state.fitMode}`);
      dom.focusImage.style.transform = `scale(${state.zoom})`;
      dom.zoomPercent.textContent = `${Math.round(state.zoom * 100)}%`;
      applyFitButtons();
    }

    function setViewMode(mode) {
      state.viewMode = mode;
      const isGallery = mode === 'gallery';

      dom.galleryModeBtn.classList.toggle('active', isGallery);
      dom.focusModeBtn.classList.toggle('active', !isGallery);
      dom.galleryControls.hidden = !isGallery;
      dom.focusControls.hidden = isGallery;
      dom.galleryView.hidden = !isGallery;
      dom.focusView.hidden = isGallery;

      if (isGallery) {
        renderGallery();
      } else {
        renderReaderPage();
      }

    function setFitMode(mode) {

    function updatePdfApiHint() {
      const imageProxyUrl = resolveImageProxyUrl();
      if (!imageProxyUrl) {
        dom.pdfApiHint.className = 'api-hint warning';
        dom.pdfApiHint.textContent = 'PDF export needs the Cloudflare image proxy. Deploy newspaperapp/cloudflare-worker, then open this page with ?imageProxy=https://your-worker.workers.dev';

      dom.pdfApiHint.className = 'api-hint';
      dom.pdfApiHint.textContent = `PDF export: browser generated via ${imageProxyUrl}`;

      dom.magazineReader.hidden = true;

      state.currentMagazine = null;

    async function openMagazineEdition() {
      const pubKey = dom.publicationSelect.value;
      const dateStr = dom.dateInput.value;
      const pubConfig = config.magazine[pubKey];

      if (!pubConfig || !dateStr) {
        setStatus('Choose a magazine and date first.');
        return;
      }

      setStatus('Loading magazine pages...');
      state.currentMagazine = pubConfig;
      state.currentDate = dateStr;
      state.galleryPage = 1;
      state.readerPageIndex = 0;
      state.zoom = 1;
      state.fitMode = 'width';

      dom.readerStatus.textContent = 'Checking available pages...';
      state.magazinePages = await discoverMagazinePages(pubConfig, dateStr);

      if (!state.magazinePages.length) {
        setStatus('Edition not available yet for this date.');
        showToast('No pages found for this edition.', 'error');
        dom.readerStatus.textContent = '';
        return;
      }

      openReaderShell(pubConfig, dateStr);
      renderGallery();
      setStatus(`Loaded ${state.magazinePages.length} pages.`);
      showToast('Magazine pages loaded.', 'success');
    }

    function goToReaderPageByNumber(pageNumber) {
      const idx = Number(pageNumber) - 1;
      if (Number.isNaN(idx) || idx < 0 || idx >= state.magazinePages.length) {
        showToast('Invalid page number.', 'error');
        return;
      }
      state.readerPageIndex = idx;
      renderReaderPage();
    }

    function shiftReaderPage(offset) {
      if (!state.magazinePages.length) {
        return;
      }

      const next = state.readerPageIndex + offset;
      if (next < 0 || next >= state.magazinePages.length) {
        return;
      }
      state.readerPageIndex = next;
      renderReaderPage();
    }

    function resolveImageProxyUrl() {
      const params = new URLSearchParams(window.location.search);
      const queryValue = params.get('imageProxy');

      if (queryValue && queryValue.trim()) {
        localStorage.setItem(IMAGE_PROXY_STORAGE_KEY, queryValue.trim());
      }

      const storedValue = localStorage.getItem(IMAGE_PROXY_STORAGE_KEY);
      const rawValue = (queryValue || storedValue || DEFAULT_IMAGE_PROXY_URL || '').trim();
      if (!rawValue) {
        return null;
      }

      return rawValue.replace(/\/+$/, '');
    }

    function getPdfImageUrl(imageUrl) {
      const imageProxyUrl = resolveImageProxyUrl();
      if (!imageProxyUrl) {
        return imageUrl;
      }

      return `${imageProxyUrl}/image?url=${encodeURIComponent(imageUrl)}`;
    }

    async function fetchMagazinePageBytes(page) {
      const response = await fetch(getPdfImageUrl(page.largeUrl), { cache: 'force-cache' });
      if (!response.ok) {
        throw new Error(`Page ${page.pageNumber} image failed with status ${response.status}.`);
      }

      return new Uint8Array(await response.arrayBuffer());
    }

    async function embedPageImage(pdfDoc, imageBytes) {
      try {
        return await pdfDoc.embedJpg(imageBytes);
      } catch (jpgError) {
        return pdfDoc.embedPng(imageBytes);
      }
    }

    async function downloadMagazinePdf() {
      if (!state.currentMagazine || !state.currentDate) {
        showToast('Open a magazine edition first.', 'error');
        return;
      }

      if (!window.PDFLib) {
        showToast('PDF library failed to load. Please refresh and try again.', 'error');
        return;
      }

      if (!resolveImageProxyUrl()) {
        showToast('Set the Cloudflare image proxy URL before exporting PDF.', 'error');
        updatePdfApiHint();
        return;
      }

      showLoading(dom.downloadPdfBtn, 'Building PDF...');
      setStatus('Preparing browser PDF export...', dom.readerStatus);

      try {
        const pdfDoc = await PDFLib.PDFDocument.create();

        for (const [index, page] of state.magazinePages.entries()) {
          setStatus(`Adding page ${index + 1} of ${state.magazinePages.length}...`, dom.readerStatus);
          const imageBytes = await fetchMagazinePageBytes(page);
          const image = await embedPageImage(pdfDoc, imageBytes);
          const { width, height } = image.scale(1);
          const pdfPage = pdfDoc.addPage([width, height]);
          pdfPage.drawImage(image, { x: 0, y: 0, width, height });
        }

        setStatus('Finalizing PDF...', dom.readerStatus);
        const pdfBytes = await pdfDoc.save();
        const blob = new Blob([pdfBytes], { type: 'application/pdf' });
        const downloadUrl = URL.createObjectURL(blob);
        const fileName = `${sanitizeFileName(state.currentMagazine.name)}-${state.currentDate}.pdf`;
        const anchor = document.createElement('a');
        anchor.href = downloadUrl;
        anchor.download = fileName;
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
        URL.revokeObjectURL(downloadUrl);

        setStatus('PDF downloaded successfully.', dom.readerStatus);
        showToast('PDF downloaded successfully.', 'success');
      } catch (error) {
        const message = error.message || 'PDF export failed.';
        setStatus(message, dom.readerStatus);
        showToast(message, 'error');
      } finally {
        hideLoading(dom.downloadPdfBtn);
      }
    }

    async function onDownloadClick() {
      showLoading(dom.downloadBtn, 'Loading...');
      setStatus('');

      try {
        const selectedType = getSelectedType();
        if (selectedType === 'magazine') {
          await openMagazineEdition();
          return;
        }

        const pubKey = dom.publicationSelect.value;
        const dateStr = dom.dateInput.value;
        const pubConfig = config.newspaper[pubKey];

        if (!pubConfig || !dateStr) {
          setStatus('Choose a newspaper and date first.');
          return;
        }

        const time = dom.timeInput.value;
        const url = constructNewspaperURL(pubConfig, dateStr, time);
        downloadFile(url, `${sanitizeFileName(pubConfig.name)}-${dateStr}.pdf`);
        setStatus('Download started.');
        showToast('Newspaper download started.', 'success');
      } catch (error) {
        setStatus(error.message || 'Unexpected error.');
        showToast(error.message || 'Unexpected error.', 'error');
      } finally {
        hideLoading(dom.downloadBtn);
      }
    }

    function initListeners() {
      dom.darkModeToggle.addEventListener('click', () => {
        const enabled = !dom.body.classList.contains('dark-mode');
        setDarkMode(enabled);
      });

      dom.favoritesToggle.addEventListener('click', openFavoritesModal);

      dom.favoriteCurrentBtn.addEventListener('click', () => {
        const type = getSelectedType();
        const pubKey = dom.publicationSelect.value;
        if (!pubKey) return;
        const pubName = dom.publicationSelect.options[dom.publicationSelect.selectedIndex].text;
        toggleFavorite(type, pubKey, pubName);
      });

      dom.typeRadios.forEach((radio) => {
        radio.addEventListener('change', () => {
          populatePublications();
          setStatus('');
        });
      });

      dom.publicationSelect.addEventListener('change', () => {
        const selectedType = getSelectedType();
        const pubKey = dom.publicationSelect.value;
        dom.scheduleInfo.textContent = schedules[pubKey] || '';

        if (selectedType === 'newspaper') {
          const pubConfig = config.newspaper[pubKey];
          dom.timeInput.value = pubConfig ? pubConfig.defaultTime : '';
        }
        updateFavoriteCurrentButton();
      });

      dom.downloadBtn.addEventListener('click', onDownloadClick);

      dom.backToHomeBtn.addEventListener('click', closeReaderShell);
      dom.downloadPdfBtn.addEventListener('click', downloadMagazinePdf);

      dom.galleryModeBtn.addEventListener('click', () => setViewMode('gallery'));
      dom.focusModeBtn.addEventListener('click', () => setViewMode('reader'));

      dom.galleryPrevBtn.addEventListener('click', () => {
        if (state.galleryPage > 1) {
          state.galleryPage -= 1;
          renderGallery();
        }
      });

      dom.galleryNextBtn.addEventListener('click', () => {
        const total = getTotalGalleryPages();
        if (state.galleryPage < total) {
          state.galleryPage += 1;
          renderGallery();
        }
      });

      dom.focusPrevBtn.addEventListener('click', () => shiftReaderPage(-1));
      dom.focusNextBtn.addEventListener('click', () => shiftReaderPage(1));
      dom.pageJumpBtn.addEventListener('click', () => goToReaderPageByNumber(dom.pageJumpInput.value));
      dom.pageJumpInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          goToReaderPageByNumber(dom.pageJumpInput.value);
        }
      });

      dom.zoomOutBtn.addEventListener('click', () => {
        state.zoom = Math.max(0.5, Number((state.zoom - 0.1).toFixed(2)));
        renderReaderPage();
      });

      dom.zoomInBtn.addEventListener('click', () => {
        state.zoom = Math.min(3, Number((state.zoom + 0.1).toFixed(2)));
        renderReaderPage();
      });

      dom.zoomResetBtn.addEventListener('click', () => {
        state.zoom = 1;
        renderReaderPage();
      });

      dom.fitWidthBtn.addEventListener('click', () => setFitMode('width'));
      dom.fitHeightBtn.addEventListener('click', () => setFitMode('height'));
      dom.fitNoneBtn.addEventListener('click', () => setFitMode('none'));

      document.addEventListener('keydown', (event) => {
        if (dom.magazineReader.hidden) return;
        if (state.viewMode !== 'reader') return;
        if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) return;

        if (event.key === 'ArrowLeft') {
          event.preventDefault();
          shiftReaderPage(-1);
        } else if (event.key === 'ArrowRight') {
          event.preventDefault();
          shiftReaderPage(1);
        } else if (event.key === 'Escape') {
          event.preventDefault();
          setViewMode('gallery');
        }
      });
    }

    function init() {
      const today = new Date().toISOString().split('T')[0];
      dom.dateInput.value = today;

      const savedType = localStorage.getItem('selectedType');
      if (savedType === 'magazine' || savedType === 'newspaper') {
        document.getElementById(`${savedType}Type`).checked = true;
      }

      if (localStorage.getItem('darkMode') === 'enabled') {
        setDarkMode(true);
      }

      populatePublications();
      initListeners();
      updatePdfApiHint();
    }

    init();
  </script>
</body>
</html>
